databases:
  - name: internship-tracking-db
    plan: free
    databaseName: internship_tracking
    user: internship_tracking

services:
  - type: web
    name: cdam-task1-internship-tracking-japhes
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn internship_tracking.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_SETTINGS_MODULE
        value: internship_tracking.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: internship-tracking-db
          property: connectionString
      - key: ACCESS_TOKEN_LIFETIME_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
